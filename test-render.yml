---
# Renders the OpenTofu input variables from vars.yml so CI can feed them to
# `tofu console` and exercise every validation rule in variables.tf
# without needing a libvirt host.
- name: Render OpenTofu variables for CI validation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
    - tfvars.yml
  vars:
    render_dir: /tmp/vm-tfvars
  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: '0755'

    - name: Render terraform.tfvars.json
      ansible.builtin.copy:
        content: "{{ terraform_tfvars | to_nice_json }}\n"
        dest: "{{ render_dir }}/terraform.tfvars.json"
        mode: '0644'
