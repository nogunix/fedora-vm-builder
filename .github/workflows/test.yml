name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax check / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            image: fedora:43
            install: dnf install -y ansible-core git
          - name: Fedora 44
            image: fedora:44
            install: dnf install -y ansible-core git
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            install: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y ansible-core git
          - name: CentOS Stream 10
            image: quay.io/centos/centos:stream10
            install: dnf install -y ansible-core git
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ansible-core
        run: ${{ matrix.install }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run syntax check
        run: |
          for pb in 01-create-vm.yml 99-destroy-all.yml test-render.yml; do
            ansible-playbook --syntax-check -i test/inventory "$pb"
          done

  tofu:
    name: OpenTofu fmt + validate + template render
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive

      - name: tofu init
        run: tofu init -backend=false -input=false

      - name: tofu validate
        run: tofu validate

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Install Ansible collections
        working-directory: .
        run: ansible-galaxy collection install -r requirements.yml

      # Renders vars.yml through tfvars.yml, then makes OpenTofu evaluate every
      # variable so the validation rules in variables.tf run against the shipped
      # defaults. `tofu console` reports validation problems but still exits
      # 0, so the presence of "Error:" is what fails the step.
      - name: Check vars.yml against terraform/variables.tf
        working-directory: .
        run: |
          ansible-playbook test-render.yml
          cd terraform
          tofu console -input=false \
            -var-file=/tmp/vm-tfvars/terraform.tfvars.json \
            <<< 'var.vm_prefix' > /tmp/console.out 2>&1
          cat /tmp/console.out
          if grep -q 'Error:' /tmp/console.out; then
            echo "::error::vars.yml defaults fail a validation rule in terraform/variables.tf"
            exit 1
          fi

      # cloud-init is generated by templatefile(), so render all four
      # kdump/debuginfo combinations and confirm each is still valid YAML.
      - name: Check cloud-init template renders as valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          tpl='${path.module}/templates/cloud-init.yaml.tftpl'
          for kdump in true false; do
            for debuginfo in true false; do
              echo "== kdump=$kdump debuginfo=$debuginfo =="
              args='hostname="ci-vm0", vm_user="fedora", vm_password="pw"'
              args="$args, vm_crashkernel=\"512M\""
              args="$args, vm_kdump_enabled=$kdump"
              args="$args, vm_install_debuginfo=$debuginfo"
              echo "templatefile(\"$tpl\", {$args})" \
                | tofu console -input=false \
                | sed '1d;$d' \
                | python3 -c 'import sys, yaml; yaml.safe_load(sys.stdin)' \
                && echo "valid YAML"
            done
          done
